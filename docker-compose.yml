services:
  kafka:
    image: apache/kafka:4.1.0
    restart: unless-stopped
    ports: ["127.0.0.1:9092:9092"]  # PLAINTEXT, no auth: keep it off the venue network
    environment:
      # single-node KRaft (broker + controller in one process, no ZooKeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL for other containers, EXTERNAL for your host (localhost:9092)
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
      start_period: 60s
      start_interval: 2s  # poll fast while booting, then only every minute (each check spawns a JVM)
      interval: 60s
      timeout: 20s
      retries: 3

  producer:  # HN firebase SSE -> kafka topic hn-events
    build: .
    command: python producer.py
    restart: unless-stopped
    environment: { KAFKA: "kafka:19092" }
    depends_on: { kafka: { condition: service_healthy } }

  dashboard:  # kafka -> SSE -> http://localhost:8080
    build: .
    command: python dashboard.py
    restart: unless-stopped
    ports: ["8080:8080"]
    environment: { KAFKA: "kafka:19092" }
    depends_on: { kafka: { condition: service_healthy } }

  edgar:  # SEC latest filings -> filings
    build: .
    command: python edgar.py
    restart: unless-stopped
    environment: { KAFKA: "kafka:19092", SEC_UA: "${SEC_UA:-AlphaRadar hackathon contact@example.com}" }
    depends_on: { kafka: { condition: service_healthy } }

  news:  # newswire RSS -> news
    build: .
    command: python news.py
    restart: unless-stopped
    environment: { KAFKA: "kafka:19092" }
    depends_on: { kafka: { condition: service_healthy } }

  router:  # filings -> skill-requests
    build: .
    command: python router.py
    restart: unless-stopped
    environment: { KAFKA: "kafka:19092" }
    depends_on: { kafka: { condition: service_healthy } }

  trader:  # research-verdicts + ticks -> orders, fills, pnl
    build: .
    command: python trader.py
    restart: unless-stopped
    environment: { KAFKA: "kafka:19092" }
    depends_on: { kafka: { condition: service_healthy } }

volumes:
  kafka-data:
