# The two services run independently, each needing only its own part of .env (copy .env.example;
# .env is git-ignored):
#   docker compose up -d dashboard   # needs RISINGWAVE_URL
#   docker compose up -d producer    # needs the StreamNative settings; run exactly one, anywhere
services:
  producer:  # Hacker News -> Avro -> Kafka topic hn-events on StreamNative Cloud (the image's default command)
    build: .
    restart: unless-stopped
    environment:
      KAFKA_SERVICE_URL: ${KAFKA_SERVICE_URL:-}
      SCHEMA_REGISTRY_URL: ${SCHEMA_REGISTRY_URL:-}
      JWT_TOKEN: ${JWT_TOKEN:-}
      KAFKA_USERNAME: ${KAFKA_USERNAME:-}

  dashboard:  # RisingWave materialized view -> SSE -> http://localhost:8080
    build: .
    command: python dashboard.py
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      RISINGWAVE_URL: ${RISINGWAVE_URL:-}
      RISINGWAVE_MV: ${RISINGWAVE_MV:-}
